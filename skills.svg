<svg width="500" height="290" viewBox="0 0 500 290" xmlns="http://www.w3.org/2000/svg" fill="none">
  <style>
    text { font-family: 'Segoe UI', Ubuntu, sans-serif; fill: #c9f7d4; }
    .label { font-size: 14px; font-weight: 600; }
    .pct   { font-size: 12px; fill: #7ee787; }
    .track { fill: #10231a; }
    .bar   { fill: url(#grad); }
    @keyframes grow { from { width: 0; } }
    .b1 { animation: grow 1.4s cubic-bezier(.2,.8,.2,1) forwards; }
    .b2 { animation: grow 1.4s .15s cubic-bezier(.2,.8,.2,1) forwards; }
    .b3 { animation: grow 1.4s .30s cubic-bezier(.2,.8,.2,1) forwards; }
    .b4 { animation: grow 1.4s .45s cubic-bezier(.2,.8,.2,1) forwards; }
    .b5 { animation: grow 1.4s .60s cubic-bezier(.2,.8,.2,1) forwards; }
  </style>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <!-- React.js -->
  <text class="label" x="0" y="26">React.js</text>
  <text class="pct" x="470" y="26" text-anchor="end">90%</text>
  <rect class="track" x="0" y="34" width="470" height="14" rx="7"/>
  <rect class="bar b1" x="0" y="34" width="423" height="14" rx="7"/>

  <!-- JavaScript -->
  <text class="label" x="0" y="78">JavaScript (ES6+)</text>
  <text class="pct" x="470" y="78" text-anchor="end">88%</text>
  <rect class="track" x="0" y="86" width="470" height="14" rx="7"/>
  <rect class="bar b2" x="0" y="86" width="414" height="14" rx="7"/>

  <!-- React Native -->
  <text class="label" x="0" y="130">React Native</text>
  <text class="pct" x="470" y="130" text-anchor="end">82%</text>
  <rect class="track" x="0" y="138" width="470" height="14" rx="7"/>
  <rect class="bar b3" x="0" y="138" width="385" height="14" rx="7"/>

  <!-- Python / FastAPI -->
  <text class="label" x="0" y="182">Python &amp; FastAPI</text>
  <text class="pct" x="470" y="182" text-anchor="end">78%</text>
  <rect class="track" x="0" y="190" width="470" height="14" rx="7"/>
  <rect class="bar b4" x="0" y="190" width="367" height="14" rx="7"/>

  <!-- Android / Kotlin -->
  <text class="label" x="0" y="234">Android / Kotlin</text>
  <text class="pct" x="470" y="234" text-anchor="end">72%</text>
  <rect class="track" x="0" y="242" width="470" height="14" rx="7"/>
  <rect class="bar b5" x="0" y="242" width="338" height="14" rx="7"/>
</svg>
